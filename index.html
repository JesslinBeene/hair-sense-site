<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hair Sense</title>
  <meta name="description" content="Hair Sense — website coming soon.">
  <style>
    :root { --bg: #faf7f4; --fg: #2b2522; --muted: #7a6f69; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f0eb; --muted: #a8a29e; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 16px;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: normal; letter-spacing: .02em; }
    p { margin-top: .75rem; color: var(--muted); font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Hair Sense</h1>
    <p>Website coming soon.</p>
  </main>
</body>
</html>
